<text x="110" y="110" font-family="Arial,sans-serif" font-size="12" letter-spacing="0.5" fill="#cba65a">Sequential travel, one part per interval</text>

<line x1="60" y1="392" x2="740" y2="392" stroke="#5e7f96" stroke-width="2" stroke-dasharray="6 5"></line>
<text x="60" y="412" font-family="Arial,sans-serif" font-size="12" fill="#7f9db2">Full front access retained for maintenance and cleaning</text>
<text x="40" y="452" font-family="Arial,sans-serif" font-size="15" fill="#9fbacd">Timing is set by the transfer mechanism rather than by manual handling,</text>
<text x="40" y="472" font-family="Arial,sans-serif" font-size="15" fill="#9fbacd">so station-to-station intervals stay consistent as throughput rises.</text>
<text x="40" y="494" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.3" fill="#5e7f96">FILING-SAFE ABSTRACT VIEW — PROTECTED GEOMETRY NOT SHOWN</text>
</svg>