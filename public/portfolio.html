<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page moved — EngineeringXYZ</title>
    <!-- GitHub Pages serves no server-side redirects, so this stands in for a
         301: the canonical tag passes ranking signals to the new URL and the
         refresh moves visitors immediately. -->
    <link rel="canonical" href="https://www.engineeringxyz.com/projects.html" />
    <meta http-equiv="refresh" content="0; url=/projects.html" />
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <p>
      This page has moved to <a href="/projects.html">Projects</a>.
    </p>
  </body>
</html>
